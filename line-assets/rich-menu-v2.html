<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@500&display=block" rel="stylesheet">
<style>
/* Rich menu v2 (2500x843): background drawn by the owner (rich-menu-background-v2.png), labels set here so the
   Thai text is crisp. Buttons left to right: รูปขนม -> /gallery/, เว็บไซต์ -> /, คุยกับแอดมิน -> chat. */
*{margin:0;box-sizing:border-box}
html,body{width:2500px;height:843px;overflow:hidden;background:#FFFBF3}
body{background:url(rich-menu-background-v2.png) 0 0/100% 100% no-repeat;display:grid;grid-template-columns:repeat(3,1fr)}
div{display:flex;align-items:flex-end;justify-content:center;padding-bottom:105px;font:500 104px/1 Mitr,"Sukhumvit Set",Thonburi,sans-serif;color:#2F4A45;letter-spacing:.01em}
</style>
</head>
<body><div>รูปขนม</div><div>เว็บไซต์</div><div>คุยกับแอดมิน</div></body>
</html>
