<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&display=block" rel="stylesheet">
<style>
/* Rich menu v3, large (2500x1686): 1 wide on top + 3 below. Background drawn with AI (rich-menu-background-v3.png),
   labels set here so the Thai text is crisp. The top is covered by a dark green panel (cream June logo, like the /box header). Areas: top = เว็บไซต์ -> /, bottom left to right: Gallery -> /gallery/,
   โปรเดือนนี้ -> /promo, คุยกับแอดมิน -> chat. */
*{margin:0;box-sizing:border-box}
html,body{width:2500px;height:1686px;overflow:hidden;background:#FFF6E6}
body{background:url(rich-menu-background-v3.png) 0 0/100% 100% no-repeat;position:relative;font-family:Mitr,"Sukhumvit Set",Thonburi,sans-serif;color:#2F4A45}
.top{position:absolute;left:1300px;right:120px;top:0;height:843px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.top b{font:500 190px/1 Mitr,sans-serif}
.top span{font:400 76px/1.2 Mitr,sans-serif;margin-top:34px;color:#5d7a73}
/* dark green top like the /box header: cream June logo + cream label (covers the drawn shop) */
.hero{position:absolute;left:12px;top:12px;width:2476px;height:829px;border-radius:34px 34px 0 0;background:#3E5D58;display:flex;align-items:center;justify-content:center;gap:150px}
.hero img{width:760px}
.hero div{display:flex;flex-direction:column;align-items:flex-start;color:#FFF6E6}
.hero b{font:500 200px/1 Mitr,sans-serif}
.hero span{font:400 80px/1.2 Mitr,sans-serif;margin-top:36px;color:#C9DE98}
.bot{position:absolute;top:1425px;width:833px;text-align:center;font:500 104px/1 Mitr,sans-serif}
</style>
</head>
<body>
  <div class="hero"><img src="june-mark-cream.svg" alt=""><div><b>เว็บไซต์</b><span>ดูเมนู · สั่งทาง LINE</span></div></div>
  <div class="bot" style="left:0">Gallery</div>
  <div class="bot" style="left:833px">โปรเดือนนี้</div>
  <div class="bot" style="left:1666px">คุยกับแอดมิน</div>
</body>
</html>
