# ชื่อ app ต้องไม่ซ้ำกับใครใน Fly.io ถ้าซ้ำให้เปลี่ยนตรงนี้และที่ DJANGO_ALLOWED_HOSTS ให้ตรงกัน
app = "june-bakery"
primary_region = "sin"

[env]
  DJANGO_ALLOWED_HOSTS = "june-bakery.fly.dev"
  LINE_OA_ID = "@561hgrea"

# ดิสก์ถาวร เก็บฐานข้อมูลและไฟล์ที่อัปโหลด
[[mounts]]
  source = "june_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
