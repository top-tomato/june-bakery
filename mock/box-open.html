<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>June — กล่องเปิดฝา (mock)</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600&family=Mitr:wght@400;500;600&family=Itim&display=swap" rel="stylesheet">
<style>
/* Scroll-driven 3D box: lid opens, 4 chiffon pieces inside, price appears. The box and lid here are drawn in code as
   stand-ins; the real ones would be the two Meshy .glb files. The chiffon is the real pandan.glb from the site (x4). */
:root{--ink:#243b37;--cream:#fff6e6;--tea:#f3a18f;--fl:#C9DE98;--indigo:#3e5d58}
*{box-sizing:border-box;margin:0}
body{font-family:Anuphan,system-ui,sans-serif;background:var(--fl);color:var(--ink)}
.intro,.outro{min-height:70vh;display:grid;place-items:center;text-align:center;padding:40px 16px}
.intro h1{font:600 clamp(1.6rem,5vw,2.6rem) Mitr}
.intro p,.outro p{opacity:.7;margin-top:6px}
.scene{height:320vh;position:relative;background:var(--indigo);color:var(--cream)}
.kick{position:absolute;left:0;right:0;top:9vh;text-align:center;font:500 1rem Mitr;letter-spacing:.08em;opacity:calc(.85 - var(--p,0)*2)}
.pin{position:sticky;top:0;height:100vh;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.cap{position:absolute;left:0;right:0;bottom:7vh;text-align:center;pointer-events:none}
.cap .k{font:26px Itim,cursive;opacity:calc(1 - var(--p,0)*4)}
.buy{display:inline-flex;align-items:center;gap:18px;opacity:var(--b,0);transform:translateY(calc((1 - var(--b,0))*20px))}
.buy strong{font:500 2.2rem/1 Mitr;text-align:left}
.buy strong small{display:block;font:500 1rem Anuphan;opacity:.75;margin-top:4px}
.btn{font:500 1rem Mitr;background:var(--cream);color:var(--ink);padding:12px 22px;border-radius:999px;text-decoration:none;pointer-events:auto}
.note{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(36,59,55,.88);color:var(--cream);font-size:.8rem;padding:6px 14px;border-radius:14px;z-index:9;width:max-content;max-width:calc(100% - 32px);text-align:center}
</style>
</head>
<body>
<p class="note">mock · กล่องทำตามรูปกล่องจริงของร้าน · ชิฟฟ่อนเป็นไฟล์จริง</p>
<section class="intro"><div><h1>ชิฟฟ่อน มะพร้าวใบเตย</h1><p>(ส่วนเล่าเรื่องขนม) เลื่อนลง</p></div></section>
<section class="scene" id="scene"><div class="pin">
  <canvas id="c"></canvas>
  <p class="kick">สั่งเป็นกล่อง</p>
  <div class="cap"><p class="k">ใส่ให้ครบ 4 ชิ้น</p>
    <div class="buy"><strong>฿120<small>กล่อง 4 ชิ้น</small></strong><a class="btn" href="#">สั่งทาง LINE</a></div></div>
</div></section>
<section class="outro"><div><p>(ส่วนถัดไปของหน้าเว็บ)</p></div></section>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/+esm';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js/+esm';
import {RoomEnvironment} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/environments/RoomEnvironment.js/+esm';
import {MeshoptDecoder} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/meshopt_decoder.module.js/+esm';

const canvas=document.getElementById('c'), scene=document.getElementById('scene'), pin=scene.firstElementChild
const r=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true}); r.setPixelRatio(Math.min(devicePixelRatio,2))
r.toneMapping=THREE.ACESFilmicToneMapping; r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap
const s=new THREE.Scene(), pm=new THREE.PMREMGenerator(r); s.environment=pm.fromScene(new RoomEnvironment(),.04).texture
const cam=new THREE.PerspectiveCamera(32,1,.1,100)
const sun=new THREE.DirectionalLight(0xfff1dc,2.2); sun.position.set(3,6,4); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024)
Object.assign(sun.shadow.camera,{left:-4,right:4,top:4,bottom:-4}); s.add(sun)
const ground=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.ShadowMaterial({opacity:.18})); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; s.add(ground)

// Box modelled on the shop's real box (photo ref): kraft brown inside and out, square, shallow (cake tops level with
// the rim), 4 pieces packed tight 2x2. Lid hinged at the back with a big clear window (rounded corners), a front
// tuck flap and two side flaps; opened, it lies back almost flat.
// kraft paper, not wood: even, muted brown with tiny fibre specks in every direction (no long streaks)
function kraft(base){const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,512,512)
  for(let i=0;i<9000;i++){const x=Math.random()*512,y=Math.random()*512,a=Math.random()*Math.PI,l=1+Math.random()*4
    g.strokeStyle=`rgba(${Math.random()<.55?'60,40,20':'225,195,150'},${.05+Math.random()*.12})`;g.lineWidth=.6+Math.random()*.6
    g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}
  for(let i=0;i<30;i++){const x=Math.random()*512,y=Math.random()*512,r=40+Math.random()*80,rg=g.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,`rgba(80,55,30,${Math.random()*.035})`);rg.addColorStop(1,'rgba(80,55,30,0)');g.fillStyle=rg;g.fillRect(x-r,y-r,2*r,2*r)} // faint, soft-edged tone changes
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t}
const paper=new THREE.MeshStandardMaterial({map:kraft('#7d5426'),roughness:1,envMapIntensity:.6,side:THREE.DoubleSide})
const inner=new THREE.MeshStandardMaterial({map:kraft('#8a5d2a'),roughness:1,envMapIntensity:.6})
// clear plastic window: faint haze plus diagonal glare streaks, so it reads as film, not a hole
function glare(){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');g.fillStyle='rgba(255,255,255,.22)';g.fillRect(0,0,256,256)
  for(const [x,w,a] of [[40,60,.55],[120,18,.45],[175,40,.35]]){const gr=g.createLinearGradient(x,0,x+w,0);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,`rgba(255,255,255,${a})`);gr.addColorStop(1,'rgba(255,255,255,0)')
    g.save();g.translate(128,128);g.rotate(-.6);g.translate(-128,-128);g.fillStyle=gr;g.fillRect(x-200,-200,w,700);g.restore()}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const film=new THREE.MeshPhysicalMaterial({color:0xffffff,map:glare(),transparent:true,opacity:.9,roughness:.08,metalness:0,clearcoat:1,clearcoatRoughness:.04,envMapIntensity:1.4,side:THREE.DoubleSide,depthWrite:false})
const part=(w,h,d,m,x,y,z)=>{const geo=new THREE.BoxGeometry(w,h,d), uv=geo.attributes.uv
  ;[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]].forEach(([su,sv],f)=>{for(let i=f*4;i<f*4+4;i++)uv.setXY(i,uv.getX(i)*su*.8,uv.getY(i)*sv*.8)})
  const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;return o}
const rrect=(sh,x,y,w,h,r)=>{sh.moveTo(x+r,y);sh.lineTo(x+w-r,y);sh.quadraticCurveTo(x+w,y,x+w,y+r);sh.lineTo(x+w,y+h-r);sh.quadraticCurveTo(x+w,y+h,x+w-r,y+h);sh.lineTo(x+r,y+h);sh.quadraticCurveTo(x,y+h,x,y+h-r);sh.lineTo(x,y+r);sh.quadraticCurveTo(x,y,x+r,y);return sh}

// one-piece lock-corner window box (the usual Thai bakery kraft box, ~16x17.5x7.5 cm): four walls the same height,
// the lid is the back wall folded over, closing flat on the rim; its front tuck flap and side dust flaps slide INSIDE
// the walls, so from outside it is one plain box with a window on top
const W=2.08, H=.68, TOP=H, T=.005, box=new THREE.Group()
box.add(part(W,T,W,inner,0,T/2,0))
for(const [w,d,x,z,h] of [[W,T,0,W/2,H],[W,T,0,-W/2,H],[T,W,W/2,0,H],[T,W,-W/2,0,H]]){
  box.add(part(w,h,d,paper,x,h/2,z))
}
s.add(box)
// logo sticker on the front wall: cream oval label, logo in the shop's dark green, a little gloss
{const SW=.92, SH=.44, c=document.createElement('canvas'); c.width=920; c.height=440; const g=c.getContext('2d')
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace; tex.anisotropy=8
  const draw=img=>{g.clearRect(0,0,920,440); g.fillStyle='#fff6e6'; g.beginPath(); g.ellipse(460,220,452,212,0,0,7); g.fill()
    g.strokeStyle='#3e5d58'; g.lineWidth=6; g.beginPath(); g.ellipse(460,220,428,190,0,0,7); g.stroke()
    if(img){const t=document.createElement('canvas'); t.width=img.width; t.height=img.height; const tg=t.getContext('2d')
      tg.drawImage(img,0,0); tg.globalCompositeOperation='source-in'; tg.fillStyle='#243b37'; tg.fillRect(0,0,t.width,t.height)
      const h=300, w=h*img.width/img.height; g.drawImage(t,460-w/2,220-h/2,w,h)}
    tex.needsUpdate=true}
  draw(); const img=new Image(); img.onload=()=>draw(img); img.src='img/logo.png'
  const st=new THREE.Mesh(new THREE.PlaneGeometry(SW,SH),new THREE.MeshPhysicalMaterial({map:tex,transparent:true,roughness:.45,clearcoat:.4,clearcoatRoughness:.3}))
  st.position.set(0,H*.5,W/2+T/2+.003); box.add(st)}
// lid: hinge on the back top edge, plate hangs forward (+z) from it
const hinge=new THREE.Group(); hinge.position.set(0,TOP,-W/2); s.add(hinge) // exactly on the back wall top: the lid is the same sheet folded, no gap
const lid=new THREE.Group(); hinge.add(lid)
const L=W+T, m=.42                                     // lid size, kraft border around the window
const plate=rrect(new THREE.Shape(),-L/2,-.012,L,L+.012,.006); plate.holes.push(rrect(new THREE.Path(),-L/2+m,m,L-2*m,L-2*m,.12))
const pg=new THREE.ExtrudeGeometry(plate,{depth:T,bevelEnabled:false}); pg.rotateX(Math.PI/2); pg.translate(0,T,0)
const lidPlate=new THREE.Mesh(pg,paper); lidPlate.castShadow=lidPlate.receiveShadow=true; lid.add(lidPlate)
const win=new THREE.Mesh(new THREE.PlaneGeometry(L-2*m+.06,L-2*m+.06),film); win.rotation.x=-Math.PI/2; win.position.set(0,.002,L/2); lid.add(win)
// front tuck flap + side flaps (hang down when closed, tuck inside the walls)
const flap=part(L-T*3.4,.2,T,paper,0,-.1,L-T*1.6); lid.add(flap)
// side flaps: hang straight down from the lid's left and right edges, flush with the edge, and slide just inside the
// side walls when the lid closes
for(const sx of [-1,1]){const sh=new THREE.Shape();sh.moveTo(0,0);sh.lineTo(L-.01,0);sh.lineTo(L*.88,-.2);sh.lineTo(L*.06,-.2);sh.closePath()
  const g=new THREE.ShapeGeometry(sh);g.rotateY(-Math.PI/2);const f=new THREE.Mesh(g,paper);f.position.set(sx*(L/2-T*1.6),0,0);f.castShadow=true;lid.add(f)}

// 4 chiffon pieces from the real model, packed tight
const pieces=new THREE.Group(); s.add(pieces)
const loader=new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder)
loader.load('img/pandan.glb',g=>{
  const mdl=g.scene, b=new THREE.Box3().setFromObject(mdl), size=b.getSize(new THREE.Vector3()), c=b.getCenter(new THREE.Vector3())
  const cell=(W-T*2)/2, k=cell/Math.max(size.x,size.z)*1.03, q=cell/2-.022 // slightly oversize and overlapping so the uneven sides press together like one cut sheet
  mdl.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true}})
  ;[[-q,-q,0],[q,-q,Math.PI/2],[-q,q,Math.PI],[q,q,-Math.PI/2]].forEach(([x,z,ry])=>{
    const holder=new THREE.Group(), clone=mdl.clone(); clone.position.set(-c.x,-b.min.y,-c.z); holder.add(clone)
    holder.scale.set(k,Math.min(k,(TOP-.03)/size.y),k); holder.position.set(x,T,z); holder.rotation.y=ry; holder.userData.home={x,z,ry}; holder.visible=false; pieces.add(holder)})
})

const bounce=t=>{const n=7.5625,d=2.75;return t<1/d?n*t*t:t<2/d?n*(t-=1.5/d)*t+.75:t<2.5/d?n*(t-=2.25/d)*t+.9375:n*(t-=2.625/d)*t+.984375}
const ease=t=>t<.5?2*t*t:1-(-2*t+2)**2/2, clamp=t=>Math.min(1,Math.max(0,t)), lerp=(a,b,t)=>a+(b-a)*t
function size(){const w=pin.clientWidth,h=pin.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',size);size()
function frame(){
  const rect=scene.getBoundingClientRect(), p=clamp(-rect.top/(rect.height-innerHeight))
  // C: the box waits open (lid up), the pieces drop in one by one, then the lid lies back and the camera looks down
  const look=ease(clamp((p-.62)/.25)), show=ease(clamp(p/.06))
  hinge.rotation.x=-lerp(1.75,2.95,look)          // ~100 deg while filling, ~170 deg (lying back) at the end
  s.scale.setScalar(lerp(.7,1,show)); s.visible=show>.01
  pieces.children.forEach((h,k)=>{const t=clamp((p-(.1+k*.12))/.13), {x,z,ry}=h.userData.home
    h.visible=t>0; const fall=1-bounce(t)
    h.position.set(x,T+fall*3.2,z); h.rotation.set(fall*.5,ry+fall*.9,fall*-.3)})
  s.rotation.y=lerp(-.55,-.15,p)                  // slow turn while scrolling
  const narrow=innerWidth<700, dist=narrow?13:8
  cam.position.set(0,lerp(3.2,dist*1.2,look),lerp(dist,dist*.4,look)); cam.lookAt(0,lerp(.7,.2,look),lerp(0,-.7,look)) // ends looking down, like the photo
  pin.style.setProperty('--p',p); pin.style.setProperty('--b',clamp((p-.74)/.16))
  r.render(s,cam); requestAnimationFrame(frame)
}
frame()
</script>
</body>
</html>
