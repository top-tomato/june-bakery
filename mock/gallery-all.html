<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>June — Gallery ทั้งหมด (mock)</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600&family=Mitr:wght@500;600&family=Itim&display=swap" rel="stylesheet">
<style>
/* /gallery as one long scrapbook page (replaces the flip book): the homepage's photo section, but every photo.
   Tap a snapshot to see it full screen; swipe or use the arrows for the next one. */
:root{--cream:#FFF6E6;--paper:#FFFBF3;--green:#3E5D58;--ink:#2F4A45;--peach:#F3A18F;
  --display:"Mitr","Anuphan",system-ui,sans-serif;--body:"Anuphan",system-ui,sans-serif;--hand:"Itim","Mitr",cursive}
*{box-sizing:border-box;margin:0}
body{font-family:var(--body);color:var(--ink);background:radial-gradient(circle,rgba(47,74,69,.2) .9px,transparent 1.3px) 0 0/18px 18px,var(--paper)}
.note{background:#1c2b28;color:var(--cream);padding:10px 16px;font-size:.85rem;text-align:center}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(255,251,243,.92);backdrop-filter:blur(8px);border-bottom:1px solid #eee3d1}
.top a{color:var(--ink);text-decoration:none;font:500 .95rem var(--display)}
.top .lg{width:62px;aspect-ratio:1000/660;background:var(--ink);-webkit-mask:url(img/logo.png) center/contain no-repeat;mask:url(img/logo.png) center/contain no-repeat}
.top .line{background:var(--ink);color:var(--cream);padding:8px 14px;border-radius:999px;font-size:.85rem}
.wrap{max-width:1040px;margin:0 auto;padding:34px clamp(14px,5vw,60px) 80px}
.kicker{font:1.1rem var(--hand);color:var(--peach)}
h1{font:600 clamp(2rem,6vw,3.2rem)/1.15 var(--display);margin:4px 0 6px}
.sub{font:1.05rem var(--hand);opacity:.8;margin-bottom:30px}
.board{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-flow:dense;gap:28px 22px;align-items:start}
.snap{position:relative;margin:0;background:#fff;padding:10px 10px 0;box-shadow:0 6px 14px rgba(0,0,0,.14);transform:rotate(var(--r,0deg));cursor:zoom-in;transition:transform .2s}
.snap:hover{transform:rotate(0) scale(1.02)}
.snap img,.snap video{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#eee}
.snap.tall{grid-row:span 2}.snap.tall img{aspect-ratio:4/5}.snap.tall video{aspect-ratio:9/16}
.snap p{font:1.05rem var(--hand);text-align:center;padding:8px 0 10px}
/* a polaroid keeps its thick bottom edge even without a caption (thin = looks cut off) */
.snap:not(:has(p)){padding-bottom:44px}
.snap .tape{position:absolute;top:-12px;left:50%;width:84px;height:24px;margin-left:-42px;background:rgba(243,161,143,.55);transform:rotate(-5deg);z-index:1}
.snap .tape.g{background:rgba(201,222,152,.75);transform:rotate(4deg)}
.snap .badge{position:absolute;top:18px;left:18px;font:600 .75rem var(--display);background:rgba(36,59,55,.8);color:var(--cream);padding:2px 10px;border-radius:999px}
.end{text-align:center;margin-top:56px}
.end p{font:1.2rem var(--hand);margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:999px;background:var(--ink);color:var(--cream);font:600 1rem var(--display);text-decoration:none}
@media (max-width:720px){.board{grid-template-columns:repeat(2,1fr);gap:22px 14px}.snap p{font-size:.95rem}}
/* opening, like the landing page: a cream curtain with the June logo filling up 0-100%, then the curtain lifts with
   dripping cream along its edge, and the snapshots drop onto the page one by one. (The real page reuses the landing's
   WebGL curtain; this mock fakes it with CSS.) */
.curtain{position:fixed;inset:0;z-index:100;pointer-events:none}
.curtain .sheet{position:absolute;inset:0 0 auto;height:100%;background:#FFF6E6;transform:translateY(0);transition:transform 1.1s cubic-bezier(.7,0,.2,1)}
.curtain .drip{position:absolute;left:0;right:0;top:100%;height:120px;width:100%}
.curtain.lift .sheet{transform:translateY(calc(-100% - 130px))}
.curtain .count{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:14px;transition:opacity .3s}
.curtain.lift .count{opacity:0}
.curtain .lgwrap{position:relative;width:min(56vw,240px);aspect-ratio:1000/660}
.curtain .lgwrap span{position:absolute;inset:0;-webkit-mask:url(img/logo.png) center/contain no-repeat;mask:url(img/logo.png) center/contain no-repeat}
.curtain .ghost{background:rgba(47,74,69,.15)}
.curtain .fill{background:var(--ink);clip-path:inset(100% 0 0 0)}
.curtain .pct{font:500 1rem var(--display);color:var(--ink);opacity:.7}
.snap.pre{opacity:0;transform:translateY(-40px) rotate(calc(var(--r,0deg) * 4)) scale(1.06)}
.snap.drop{transition:opacity .35s ease-out,transform .55s cubic-bezier(.3,1.4,.5,1)}
.kicker,h1,.sub{transition:opacity .5s,transform .5s}
body.pre .kicker,body.pre h1,body.pre .sub{opacity:0;transform:translateY(14px)}
@media (prefers-reduced-motion:reduce){.curtain{display:none}.snap.pre{opacity:1;transform:rotate(var(--r,0deg))}body.pre .kicker,body.pre h1,body.pre .sub{opacity:1;transform:none}}
/* full-screen viewer */
.lb{position:fixed;inset:0;z-index:50;background:rgba(20,30,28,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .2s;touch-action:pan-y}
.lb.on{opacity:1;pointer-events:auto}
.lb .stage{width:min(92vw,560px);max-height:76vh;display:grid;place-items:center}
.lb img,.lb video{max-width:100%;max-height:76vh;border:8px solid #fff;box-shadow:0 20px 40px rgba(0,0,0,.4);background:#eee}
.lb .cap{color:var(--cream);font:1.15rem var(--hand);min-height:1.5em;text-align:center}
.lb .row{display:flex;align-items:center;gap:16px;color:var(--cream)}
.lb button{width:46px;height:46px;border-radius:50%;border:2px solid var(--cream);background:none;color:var(--cream);font-size:1.2rem;cursor:pointer}
.lb .x{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;border:0;font-size:1.6rem}
.lb .n{min-width:60px;text-align:center;font-size:.9rem;opacity:.8}
</style>
</head>
<body class="pre">
<div class="curtain" id="curtain" aria-hidden="true"><div class="sheet"><div class="count"><div class="lgwrap"><span class="ghost"></span><span class="fill" id="cfill"></span></div><div class="pct" id="cpct">0%</div></div><svg class="drip" viewBox="0 0 400 120" preserveAspectRatio="none" id="cdrip"></svg></div></div>
<p class="note">mock: หน้า /gallery แบบหน้า landing · แตะรูปเพื่อดูเต็มจอ ปัดซ้ายขวาหรือกดลูกศรเพื่อดูรูปถัดไป</p>
<div class="top"><a href="gallery-scrapbook.html">← หน้าแรก</a><div class="lg" role="img" aria-label="June"></div><a class="line" href="#">สั่งทาง LINE</a></div>
<main class="wrap">
  <div class="kicker">Gallery</div>
  <h1>จากครัว June</h1>
  <p class="sub">อบเสร็จ ถ่ายเก็บไว้ทุกวัน</p>
  <div class="board" id="board"></div>
  <div class="end"><p>อยากชิมแล้ว? ทักมาสั่งได้เลย</p><a class="btn" href="#">สั่งทาง LINE</a></div>
</main>
<div class="lb" id="lb" aria-hidden="true">
  <button class="x" id="x" aria-label="ปิด">×</button>
  <div class="stage" id="stage"></div>
  <div class="cap" id="cap"></div>
  <div class="row"><button id="pv" aria-label="รูปก่อน">←</button><span class="n" id="n"></span><button id="nx" aria-label="รูปถัดไป">→</button></div>
</div>
<script>
const ITEMS=[
  ['img/shop-12.jpg','ชิฟฟ่อนมะพร้าวใบเตย'],['video','Snack box'],['img/shop-05.jpg','ออกจากเตา'],['img/shop-14.jpg','วันที่ครัวยุ่ง'],
  ['img/shop-13.jpg','จัดโต๊ะ'],['img/shop-10.jpg','หลายหน้าตา'],['img/shop-07.jpg',''],['img/shop-11.jpg',''],['img/shop-02.jpg',''],
  ['img/shop-08.jpg',''],['img/shop-15.jpg',''],['img/shop-03.jpg',''],['img/shop-09.jpg',''],['img/shop-04.jpg',''],['img/shop-01.jpg',''],['img/shop-06.jpg','']];
const TILT=[-2,2,3,-3,1.5,-1.5];
document.getElementById('board').innerHTML=ITEMS.map(([src,cap],k)=>{const v=src==='video';
  return `<figure class="snap${v||k%7===0?' tall':''}" style="--r:${TILT[k%6]}deg" data-k="${k}"><span class="tape${k%2?' g':''}"></span>${v?'<video src="img/snackbox.mp4" poster="img/snackbox-poster.jpg" muted loop playsinline autoplay></video><span class="badge">วิดีโอ</span>':`<img src="${src}" alt="${cap}" loading="lazy">`}${cap?`<p>${cap}</p>`:''}</figure>`}).join('');
/* curtain: count 0-100% while the logo fills, then lift and drop the snapshots in */
(function intro(){
  const snaps=[...document.querySelectorAll('.snap')];snaps.forEach(f=>f.classList.add('pre'));
  // a row of round-ended cream drips hanging off the curtain's bottom edge
  let d='M0 0H400V20';for(let x=400;x>0;x-=25){const w=25,h=20+((x*37)%60);d+=`L${x} 20V${h-8}a${w/2-2} ${w/2-2} 0 0 1 -${w-4} 0V20`}
  document.getElementById('cdrip').innerHTML=`<path d="${d}V20H0Z" fill="#FFF6E6"/>`;
  const t0=performance.now(),fill=document.getElementById('cfill'),pct=document.getElementById('cpct'),c=document.getElementById('curtain');
  const tick=t=>{const k=Math.min(1,(t-t0)/850);fill.style.clipPath=`inset(${(1-k)*100}% 0 0 0)`;pct.textContent=Math.round(k*100)+'%';
    if(k<1)return requestAnimationFrame(tick);
    setTimeout(()=>{c.classList.add('lift');document.body.classList.remove('pre');
      const vis=snaps.filter(f=>f.getBoundingClientRect().top<innerHeight);
      vis.forEach((f,i)=>setTimeout(()=>{f.classList.add('drop');f.classList.remove('pre')},350+i*110));
      setTimeout(()=>{c.remove();snaps.forEach(f=>{f.classList.remove('pre');f.classList.add('drop')})},350+vis.length*110+700);
      // snapshots further down drop in as they scroll into view
      const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('drop');e.target.classList.remove('pre');io.unobserve(e.target)}}),{rootMargin:'0px 0px -10% 0px'});
      snaps.filter(f=>!vis.includes(f)).forEach(f=>io.observe(f));
    },250)};
  requestAnimationFrame(tick);
})();

const lb=document.getElementById('lb');let cur=0;
function show(k){cur=(k+ITEMS.length)%ITEMS.length;const [src,cap]=ITEMS[cur];
  document.getElementById('stage').innerHTML=src==='video'?'<video src="img/snackbox.mp4" muted loop playsinline autoplay controls></video>':`<img src="${src}" alt="${cap}">`;
  document.getElementById('cap').textContent=cap;document.getElementById('n').textContent=`${cur+1} / ${ITEMS.length}`;
  lb.classList.add('on');lb.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
const close=()=>{lb.classList.remove('on');lb.setAttribute('aria-hidden','true');document.body.style.overflow='';document.getElementById('stage').innerHTML=''};
document.getElementById('board').onclick=e=>{const f=e.target.closest('.snap');if(f)show(+f.dataset.k)};
document.getElementById('x').onclick=close;document.getElementById('pv').onclick=()=>show(cur-1);document.getElementById('nx').onclick=()=>show(cur+1);
lb.onclick=e=>{if(e.target===lb)close()};
addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;if(e.key==='Escape')close();if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1)});
let sx=null;lb.addEventListener('pointerdown',e=>sx=e.clientX);lb.addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>50)show(cur+(dx<0?1:-1))});
</script>
</body>
</html>
