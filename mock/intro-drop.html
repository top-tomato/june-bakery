<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>June — เทียบท่าขนมเข้าฉาก (mock)</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600&family=Mitr:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--tea:#F3A18F;--cream:#FFF6E6;--indigo:#3E5D58;--indigo-2:#2C4540;--ink:#243B37;--display:"Mitr","Anuphan",system-ui,sans-serif;--body:"Anuphan",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{font-family:var(--body);background:var(--indigo-2);color:var(--cream);padding:24px 16px 48px;line-height:1.6}
header{max-width:1200px;margin:0 auto 20px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
h1{font-family:var(--display);font-weight:600;font-size:clamp(1.3rem,3vw,1.9rem)}
p.note{opacity:.75;font-size:.95rem}
button{font:600 1rem var(--body);padding:10px 22px;border-radius:999px;border:0;background:var(--cream);color:var(--ink);cursor:pointer}
.grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{background:var(--indigo);border-radius:24px;overflow:hidden;position:relative;border:2px solid transparent}
.card.rec{border-color:var(--tea)}
.card canvas{display:block;width:100%;aspect-ratio:16/10}
.cap{position:absolute;left:16px;top:12px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.cap b{font-family:var(--display);font-weight:600;font-size:1.15rem}
.cap small{display:block;opacity:.75;font-size:.85rem}
.tag{font-size:.75rem;font-weight:600;background:var(--tea);color:var(--ink);padding:2px 10px;border-radius:999px;white-space:nowrap}
.card .again{position:absolute;right:12px;bottom:12px;padding:6px 14px;font-size:.85rem}
@media (max-width:720px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div>
    <h1>ขนมเข้าฉากตอนเปิดหน้าเว็บ</h1>
    <p class="note">กด "เล่นใหม่" เพื่อดูซ้ำ · กรอบสีส้ม = แบบที่แนะนำ</p>
  </div>
  <button id="all">เล่นใหม่ทั้งหมด</button>
</header>
<div class="grid" id="grid"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/+esm';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js/+esm';
import {RoomEnvironment} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/environments/RoomEnvironment.js/+esm';
import {MeshoptDecoder} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/meshopt_decoder.module.js/+esm';

const clamp=v=>Math.min(1,Math.max(0,v)),lerp=(a,b,t)=>a+(b-a)*t;
const inQ=t=>t*t, outC=t=>1-Math.pow(1-t,3);
const outBack=(t,s=1.7)=>1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2);
const bounce=t=>{const n=7.5625,d=2.75;return t<1/d?n*t*t:t<2/d?n*(t-=1.5/d)*t+.75:t<2.5/d?n*(t-=2.25/d)*t+.9375:n*(t-=2.625/d)*t+.984375};
const H=4.29; // visible world height at z=8, fov 30

// each returns {y, sx, sy} for progress-time ms
const STYLES=[
  {name:'แบบเดิม',sub:'ตกจากสูง 1 จอ เด้ง 3 ครั้ง',dur:1300,
   f:ms=>{const d=clamp(ms/1300);return{y:(1-bounce(d))*H*1.1,sx:1,sy:1}}},
  {name:'1 · ลอยขึ้นจากเตา',sub:'โผล่จากล่างนิดเดียว ขยาย 60% → 105% → 100%',dur:650,rec:true,
   f:ms=>{const d=clamp(ms/650),s=lerp(.6,1,outBack(d,1.4));return{y:-(1-outC(d))*H*.12,sx:s,sy:s}}},
  {name:'2 · ตกเบา ๆ',sub:'ตกจากสูง 25% เด้งครั้งเดียว',dur:900,
   f:ms=>{const d=clamp(ms/900);let y;
     if(d<.6)y=(1-inQ(d/.6))*H*.25;else{const b=(d-.6)/.4;y=Math.sin(b*Math.PI)*H*.035}
     return{y,sx:1,sy:1}}},
  {name:'3 · ตกแล้วยุบตัว',sub:'ตกลงมา แบนนิดหนึ่งตอนแตะพื้น แล้วเด้งกลับ',dur:1100,
   f:ms=>{const d=clamp(ms/1100);let y=0,sq=0;
     if(d<.45)y=(1-inQ(d/.45))*H*.4;
     else{const b=(d-.45)/.55;sq=Math.sin(b*Math.PI*2.5)*Math.exp(-b*4.5)*.22}
     return{y,sx:1+sq*.6,sy:1-sq}}},
];

const grid=document.getElementById('grid'),panels=[];
const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const load=url=>new Promise((ok,no)=>loader.load(url,g=>{
  let mesh;g.scene.updateMatrixWorld(true);g.scene.traverse(o=>{if(o.isMesh)mesh=o});
  const m=new THREE.Mesh(mesh.geometry,mesh.material);m.applyMatrix4(mesh.matrixWorld);ok(m)},undefined,no));
const [pandan,garlic]=await Promise.all([load('../seed/model/pandan.glb'),load('../seed/model/garlic.glb')]);

STYLES.forEach(st=>{
  const card=document.createElement('div');card.className='card'+(st.rec?' rec':'');
  card.innerHTML=`<canvas></canvas><div class="cap"><div><b>${st.name}</b><small>${st.sub}</small></div>${st.rec?'<span class="tag">แนะนำ</span>':''}</div><button class="again">เล่นใหม่</button>`;
  grid.append(card);
  const cv=card.querySelector('canvas');
  const R=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});
  R.setPixelRatio(Math.min(devicePixelRatio,2));R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=.9;
  const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(30,1.6,.1,50);cam.position.z=8;
  scene.environment=new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(),.04).texture;
  const sun=new THREE.DirectionalLight(0xfff1dd,1.2);sun.position.set(2,4,3);scene.add(sun);
  const mk=(src,x,size)=>{const outer=new THREE.Group(),inner=new THREE.Group();inner.add(src.clone());inner.scale.setScalar(size);outer.add(inner);outer.position.x=x;scene.add(outer);return{outer,inner,size,x}};
  const items=[mk(pandan,0,1.9),mk(garlic,2.6,1.05)];
  const p={st,R,scene,cam,cv,items,t0:performance.now()};panels.push(p);
  card.querySelector('.again').onclick=()=>p.t0=performance.now();
});
document.getElementById('all').onclick=()=>{const t=performance.now();panels.forEach(p=>p.t0=t)};

function frame(t){
  requestAnimationFrame(frame);
  panels.forEach(p=>{
    const w=p.cv.clientWidth,h=p.cv.clientHeight;
    if(p.cv.width!==Math.round(w*p.R.getPixelRatio())){p.R.setSize(w,h,false);p.cam.aspect=w/h;p.cam.updateProjectionMatrix()}
    p.items.forEach((it,i)=>{
      const ms=t-p.t0-400-i*180,{y,sx,sy}=ms<0?{y:p.st.name==='แบบเดิม'?H*1.1:(p.st.rec?-H*.12:H*.5),sx:p.st.rec?.6:1,sy:p.st.rec?.6:1}:p.st.f(ms);
      const vis=!(p.st.rec&&ms<0);it.outer.visible=vis;
      const ground=-.35;
      it.outer.position.set(it.x,ground+y-(1-sy)*.29*it.size,0); // squash from the bottom, not the middle
      it.outer.scale.set(sx,sy,sx);
      it.inner.rotation.set(.5,t*.0004+i*1.3,0);
    });
    p.R.render(p.scene,p.cam);
  });
}
requestAnimationFrame(frame);
</script>
</body>
</html>
